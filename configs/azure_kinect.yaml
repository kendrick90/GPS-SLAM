workspace_dir: output_online
dev_id: 0
work_mode: online
viewer_port: 6688  # TCP port for SIBR GS viewer (0 = disabled)

# Azure Kinect sensor settings are passed via command line
# This config enables Gaussian splatting for online SLAM

PIPE:
  train_method: ges
  max_iterations: 10000
  enable_densify: false
  eval_after_train: false
  save_after_train: true
  selected_cam_idx: -1

  # output paths
  model_path: "/gs_model"
  log_path: "/log"
  eval_path: "/val"
  log_iter: 100

  weight_configs:
    ssim_weight: 0.0
    depth_weight: 0.0

  vis_configs:
    color_error_max: 0.1
    depth_error_max: 0.1
    depth_vis_max: 3
    depth_vis_min: 0.2
    alpha_vis_max: 5

  # Online SLAM settings
  log_slam_state: false
  new_gs_sample_ratio: 0.1
  color_error_thres: 0.05
  localframe_cam_window_length: 2
  localframe_cam_window_interval: 5
  local_opt_iters: 10
  local_opt_interval: 10
  keyframe_theta_thres: 30
  keyframe_trans_thres: 0.30
  keyframe_select_max: 7

  keyframe_sample_configs:
    weight_intervel: 0.01
    loss_thres: 0.02
    opt_thres: 50
    sample_method: random

  remove_configs:
    large_scale_thres: 0.08
    small_scale_thres: 0.005
    low_opac_thres: 0.02

  TSDF:
    voxel_size: 0.005
    trunc_dist: 0.02
    viewFrustum_min: 0.2
    viewFrustum_max: 3.0
    load_images: false
    use_gt_pose: false
    saved_mesh: ""
    saved_engine: ""
    saved_images: ""


MODEL:
  # rendering parameters
  render_method: ges
  max_gs_radii: 100
  delta_depth: 0.1

  sh_degree: 3
  sh_degree_interval: 0
  max_init_scale: 0.01
  min_init_scale: -1
  default_opacities: 0.5

  # learning rates
  means_lr: 0.00016
  means_lr_final: 0.0000016
  scales_lr: 0.005
  quats_lr: 0.001
  featuresDc_lr: 0.0025
  featuresRest_lr: 0.0005
  opacities_lr: 5e-2
  exposure_lr: 0.003
  use_exposure: false

  # densify parameters
  densify_start_iter: 500
  densify_end_iter: 6000
  densify_interval: 100
  densify_grad_thres: 0.0002
  densify_large_thres: 0.01
  split_screen_size: 0.05
  reset_opacity_interval: 3000
  prune_opacity_thres: 0.005
