name: gps-slam
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.11

  # Build tools
  - cmake
  - make
  - ninja
  - pkg-config

  # PyTorch C++ (libtorch) - use CUDA 12.4
  - libtorch=2.5.1=gpu_cuda124*

  # C++ Libraries
  - eigen=3.4.0
  - yaml-cpp
  - assimp
  - pangolin-opengl
  - protobuf
  - boost-cpp

  # OpenGL / Graphics
  - freeglut
  - glew
  - libgl-devel
  - xorg-libx11

  # Image processing
  - opencv

  # Python packages
  - pytorch=2.5.1=*cuda12*
  - torchvision
  - numpy
  - tqdm

# ============================================================
# System Requirements
# ============================================================
# CUDA Toolkit must be installed on the system (not via conda):
#   sudo apt install cuda-toolkit-12-4
#   # or download from nvidia.com
#
# The conda environment provides:
#   - libtorch (PyTorch C++ bindings)
#   - All other C++ dependencies (eigen, yaml-cpp, pangolin, etc.)
#   - Build tools (cmake, ninja)
#
# During build, cmake will:
#   - Use system CUDA for nvcc compilation
#   - Use conda packages for linking
#   - FetchContent for indicators, tinyply, tensorboard_logger
# ============================================================
